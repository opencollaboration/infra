apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: opendesk
spec:
  destinations:
    - namespace: opencollab-opendesk
      server: https://kubernetes.default.svc
  description: "openDesk, deployed from its helmfile into the opencollab-opendesk namespace"
  sourceRepos:
    - https://github.com/opencollaboration/opendesk.git
    - https://github.com/opencollaboration/infra.git
  sourceNamespaces:
    - opencollab
