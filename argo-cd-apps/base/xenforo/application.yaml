apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xenforo
spec:
  project: opencollab
  destination:
    namespace: opencollab
    server: https://kubernetes.default.svc
  source:
    path: components/xenforo/production
    repoURL: git@github.com:opencollaboration/infra.git
    targetRevision: main
  # Set by the image trigger on every push to the xenforo image stream
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: xenforo
      jqPathExpressions:
        - .spec.template.spec.initContainers[].image
        - .spec.template.spec.containers[].image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
