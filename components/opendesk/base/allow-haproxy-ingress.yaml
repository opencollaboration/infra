# The namespace's `default` NetworkPolicy only admits traffic from pods in the namespace. Let the
# haproxy-ingress controller pods reach the openDesk services its Ingresses route to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-haproxy-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haproxy-ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: haproxy-ingress
