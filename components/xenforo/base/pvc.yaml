# Public user content (avatars, attachment thumbnails, generated assets)
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: xenforo-data
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Private state (attachment files, compiled templates, install lock)
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: xenforo-internal-data
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
