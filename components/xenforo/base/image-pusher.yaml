# Used by the xenforo-packaging GitHub workflow to push to the internal
# registry; it can only push to image streams in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xenforo-image-pusher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xenforo-image-pusher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-pusher
subjects:
  - kind: ServiceAccount
    name: xenforo-image-pusher
---
# Long-lived token, filled in by the token controller
apiVersion: v1
kind: Secret
metadata:
  name: xenforo-image-pusher-token
  annotations:
    kubernetes.io/service-account.name: xenforo-image-pusher
type: kubernetes.io/service-account-token
