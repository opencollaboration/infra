# Fixed bucket name so mysql-cluster.yaml can reference it; the generated
# secret of the same name has the AWS_* keys the backup storage expects.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: xenforo-mysql-backups
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  bucketName: opencollab-xenforo-mysql-backups
  storageClassName: ocs-storagecluster-ceph-rgw
