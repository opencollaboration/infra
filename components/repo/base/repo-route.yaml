apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: repo
  annotations:
    haproxy.router.openshift.io/timeout: 1h
    cert-manager.io/issuer-name: opencollab
spec:
  host: repo.opencollab.dev
  to:
    kind: Service
    name: repo
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None