apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: repo
  annotations:
    haproxy.router.openshift.io/timeout: 1h
spec:
  host: opencollab-repo.apps.prod1.man1.ziax.ltd
  to:
    kind: Service
    name: repo
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None