apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: repo
spec:
  podSelector:
    matchLabels:
      app: repo
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-cnpg-access
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-operators
      ports:
        - port: 8000
          protocol: TCP
